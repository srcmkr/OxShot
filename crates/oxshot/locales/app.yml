cli.usage:
  en: "OxShot – screenshots with an editor\n\nUsage:\n  oxshot                    Run in the background (tray, hotkeys)\n  oxshot capture            Capture a region (starts OxShot if needed)\n  oxshot capture --last     Capture the last region again\n  oxshot capture --full     Capture the monitor under the pointer\n  oxshot capture --delay [N]  Capture a region after N seconds (default from the settings)\n  oxshot pick               Pick a color from the screen (magnifier)\n  oxshot open <file>        Open an image or .oxshot project in the editor\n  oxshot workspace          Open the history (all captures)\n  oxshot settings           Open the settings\n  oxshot quit               Quit the running instance\n"
  de: "OxShot – Screenshots mit Editor\n\nAufruf:\n  oxshot                    Im Hintergrund starten (Tray, Hotkeys)\n  oxshot capture            Bereich aufnehmen (startet OxShot bei Bedarf)\n  oxshot capture --last     Letzten Bereich erneut aufnehmen\n  oxshot capture --full     Monitor unter dem Mauszeiger aufnehmen\n  oxshot capture --delay [N]  Bereich nach N Sekunden aufnehmen (Standard aus den Einstellungen)\n  oxshot pick               Farbe vom Bildschirm aufnehmen (Lupe)\n  oxshot open <datei>       Bild oder .oxshot-Projekt im Editor öffnen\n  oxshot workspace          Verlauf (alle Aufnahmen) öffnen\n  oxshot settings           Einstellungen öffnen\n  oxshot quit               Laufende Instanz beenden\n"
  es: "OxShot – capturas de pantalla con editor\n\nUso:\n  oxshot                    Ejecutar en segundo plano (bandeja, atajos)\n  oxshot capture            Capturar una región (inicia OxShot si hace falta)\n  oxshot capture --last     Volver a capturar la última región\n  oxshot capture --full     Capturar el monitor bajo el puntero\n  oxshot capture --delay [N]  Capturar una región tras N segundos (por defecto, según los ajustes)\n  oxshot pick               Tomar un color de la pantalla (lupa)\n  oxshot open <archivo>     Abrir una imagen o un proyecto .oxshot en el editor\n  oxshot workspace          Abrir el historial (todas las capturas)\n  oxshot settings           Abrir los ajustes\n  oxshot quit               Cerrar la instancia en ejecución\n"
  fr: "OxShot – captures d'écran avec éditeur\n\nUtilisation :\n  oxshot                    Lancer en arrière-plan (zone de notification, raccourcis)\n  oxshot capture            Capturer une zone (lance OxShot si besoin)\n  oxshot capture --last     Capturer à nouveau la dernière zone\n  oxshot capture --full     Capturer l'écran sous le pointeur\n  oxshot capture --delay [N]  Capturer une zone après N secondes (par défaut : paramètres)\n  oxshot pick               Prélever une couleur à l'écran (loupe)\n  oxshot open <fichier>     Ouvrir une image ou un projet .oxshot dans l'éditeur\n  oxshot workspace          Ouvrir l'historique (toutes les captures)\n  oxshot settings           Ouvrir les paramètres\n  oxshot quit               Quitter l'instance en cours\n"
  pt-BR: "OxShot – capturas de tela com editor\n\nUso:\n  oxshot                    Executar em segundo plano (bandeja, atalhos)\n  oxshot capture            Capturar uma região (inicia o OxShot se preciso)\n  oxshot capture --last     Capturar a última região de novo\n  oxshot capture --full     Capturar o monitor sob o ponteiro\n  oxshot capture --delay [N]  Capturar uma região após N segundos (padrão: configurações)\n  oxshot pick               Capturar uma cor da tela (lupa)\n  oxshot open <arquivo>     Abrir uma imagem ou projeto .oxshot no editor\n  oxshot workspace          Abrir o histórico (todas as capturas)\n  oxshot settings           Abrir as configurações\n  oxshot quit               Encerrar a instância em execução\n"
  ru: "OxShot — скриншоты с редактором\n\nИспользование:\n  oxshot                    Запуск в фоне (трей, горячие клавиши)\n  oxshot capture            Снять область (при необходимости запускает OxShot)\n  oxshot capture --last     Снова снять прошлую область\n  oxshot capture --full     Снять монитор под указателем\n  oxshot capture --delay [N]  Снять область через N секунд (по умолчанию — из настроек)\n  oxshot pick               Взять цвет с экрана (лупа)\n  oxshot open <файл>        Открыть изображение или проект .oxshot в редакторе\n  oxshot workspace          Открыть историю (все снимки)\n  oxshot settings           Открыть настройки\n  oxshot quit               Завершить запущенный экземпляр\n"
  zh-CN: "OxShot – 带编辑器的截图工具\n\n用法：\n  oxshot                    在后台运行（托盘、快捷键）\n  oxshot capture            截取区域（必要时启动 OxShot）\n  oxshot capture --last     再次截取上次区域\n  oxshot capture --full     截取鼠标所在的显示器\n  oxshot capture --delay [N]  N 秒后截取区域（默认取自设置）\n  oxshot pick               从屏幕拾取颜色（放大镜）\n  oxshot open <文件>        在编辑器中打开图片或 .oxshot 项目\n  oxshot workspace          打开历史（所有截图）\n  oxshot settings           打开设置\n  oxshot quit               退出正在运行的实例\n"
